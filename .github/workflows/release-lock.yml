name: Sync lockfile

# release-please bumps the version in pyproject.toml, which leaves uv.lock stale and makes
# every `uv sync --locked` fail. This refreshes the lockfile inside the release PR.

on:
  pull_request:
    branches: [main]
    paths: ["pyproject.toml"]

permissions:
  contents: read

jobs:
  sync:
    if: startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.15"
          enable-cache: true

      - run: uv lock

      - name: Commit the refreshed lockfile
        run: |
          set -euo pipefail
          if git diff --quiet uv.lock; then
            echo "uv.lock is already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync uv.lock with the released version" uv.lock
          git push
