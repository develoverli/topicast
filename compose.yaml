# topicast — minimal self-hosted setup.
# 1. Put your secrets in .env   2. Put your topics in config.yaml   3. docker compose up -d
#
# The port comes from .env (TOPICAST_PORT, default 8080) and is used inside the container and
# on the host, so changing it there is enough. TOPICAST_BIND_ADDRESS decides who can reach it:
# 127.0.0.1 (default) for this machine only, a VPN address for your tailnet, 0.0.0.0 for anyone
# who can route to this host — which, with Docker, ignores UFW. See docs/security.md.
services:
  topicast:
    image: ghcr.io/develoverli/topicast:latest
    # Build from a checkout instead:
    # build: .
    restart: unless-stopped
    env_file: [.env]
    ports:
      - "${TOPICAST_BIND_ADDRESS:-127.0.0.1}:${TOPICAST_PORT:-8080}:${TOPICAST_PORT:-8080}"
    volumes:
      - topicast-data:/data
      - ./config.yaml:/config/config.yaml:ro
    # The image ships its own HEALTHCHECK, which follows TOPICAST_PORT.

volumes:
  topicast-data:
