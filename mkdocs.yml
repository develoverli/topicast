site_name: topicast
site_description: Self-hosted notification hub for Telegram forum topics.
site_url: https://develoverli.github.io/topicast/
repo_url: https://github.com/develoverli/topicast
repo_name: develoverli/topicast
edit_uri: edit/main/docs/
copyright: MIT licensed

theme:
  name: material
  # false disables Material's Google Fonts request: the two variable faces are
  # self-hosted in docs/stylesheets/fonts, so the site makes no third-party calls.
  font: false
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - content.action.edit
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - navigation.tracking
    - navigation.indexes
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Telegram setup: telegram-setup.md
  - Configuration: configuration.md
  - API reference: api.md
  - Webhooks: webhooks.md
  - Deployment: deployment.md
  - Deploying on Dokploy: dokploy.md
  - Operations: operations.md
  - Security: security.md
  - CLI: cli.md
  - FAQ: faq.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/develoverli/topicast
