[project]
name = "topicast"
version = "0.2.0"
description = "Self-hosted notification hub that routes messages and webhooks to Telegram forum topics."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "develoverli" }]
requires-python = ">=3.12"
keywords = ["telegram", "notifications", "self-hosted", "homelab", "webhooks", "alerts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "aiosqlite>=0.22,<1",
    "alembic>=1.20,<2",
    "fastapi>=0.141,<1",
    "jinja2>=3.1,<4",
    "prometheus-client>=0.26,<1",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "python-multipart>=0.0.32",
    "python-telegram-bot>=22.8,<23",
    "pyyaml>=6.0,<7",
    "sqlalchemy[asyncio]>=2.0.54,<2.1",
    "structlog>=26.1",
    "typer>=0.27,<1",
    "uvicorn[standard]>=0.53,<1",
]

[project.urls]
Homepage = "https://github.com/develoverli/topicast"
Documentation = "https://develoverli.github.io/topicast/"
Issues = "https://github.com/develoverli/topicast/issues"
Changelog = "https://github.com/develoverli/topicast/blob/main/CHANGELOG.md"

[project.scripts]
topicast = "topicast.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=2.3",
    "pre-commit>=4",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7",
    "ruff>=0.16",
    "types-pyyaml>=6.0.12",
]
docs = [
    "mkdocs-material>=9.7",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/topicast"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PTH", "N", "C4", "RET"]
# S104: binding 0.0.0.0 is the point of a containerised service.
# RUF001-003: emoji and typographic characters are deliberate in user-facing strings.
# ASYNC109/110: the worker and the rate limiter wait on computed delays on purpose.
ignore = ["S104", "RUF001", "RUF002", "RUF003", "ASYNC109", "ASYNC110"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"src/topicast/db/migrations/**" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["prometheus_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:topicast.*"]

[tool.coverage.run]
source = ["topicast"]
branch = true
omit = ["src/topicast/db/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
